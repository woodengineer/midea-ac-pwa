# PWA additions for the CURRENT controller YAML.
#
# Replace YOUR_GITHUB_USERNAME with the account hosting the PWA.
#
# If your PWA URL is:
#   https://YOUR_GITHUB_USERNAME.github.io/midea-ac-pwa/
#
# allowed_origins must contain ONLY the origin:
#   https://YOUR_GITHUB_USERNAME.github.io

web_server:
  version: "3"
  js_include: app.js
  include_internal: false
  log: false
  ota: false
  allowed_origins:
    - https://YOUR_GITHUB_USERNAME.github.io
  enable_private_network_access: true

