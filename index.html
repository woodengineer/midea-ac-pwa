<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="light dark">
  <title>Midea AC Control</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css?v=0.2.13">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="brand-icon">
      <div>
        <div class="brand-title">AC Control</div>
        <div class="brand-subtitle" id="header-subtitle">Local ESPHome controllers</div>
      </div>
    </div>
    <button id="install-button" class="icon-button hidden" type="button" title="Install app">Install</button>
  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" data-route="dashboard" class="nav-button active">Units</button>
    <button type="button" data-route="discover" class="nav-button">Discover</button>
    <button type="button" data-route="settings" class="nav-button">Settings</button>
  </nav>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js?v=0.2.13" defer></script>
</body>
</html>
